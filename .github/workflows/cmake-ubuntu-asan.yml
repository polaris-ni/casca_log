name: CMake on Ubuntu with ASAN

on:
  push:
    branches: [ "master", "feature/*", "develop" ]
  pull_request:
    branches: [ "master", "feature/*", "develop" ]

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_CASCA_LOG_TEST_SUITE=ON -DBUILD_CASCA_LOG_TEST_ASAN=ON -DBUILD_CASCA_LOG_DEBUG=ON

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

