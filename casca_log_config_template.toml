# casca_log_config_template
[Process.casca_log_test]
# CLOG_LEVEL_OFF = 0, /* log is not allowed to write */
# CLOG_LEVEL_TRACE = 1, /* 1 << 0 */
# CLOG_LEVEL_DEBUG = 2, /* 1 << 1 */
# CLOG_LEVEL_INFO = 4, /* 1 << 2 */
# CLOG_LEVEL_WARN = 8, /* 1 << 3 */
# CLOG_LEVEL_ERROR = 16, /* 1 << 4 */
# CLOG_LEVEL_FETAL = 32, /* 1 << 5 */
level = 62 # CLOG_LEVEL_DEBUG | CLOG_LEVEL_INFO | CLOG_LEVEL_WARN | CLOG_LEVEL_ERROR | CLOG_LEVEL_FETAL
[Process.casca_log_test.test]
level = 63 # override process level
recorder = [1, 2]
[Process.casca_log_test.main]
# level inherited from process
enabled = false # main is not allowed to output log, if not set, default value is true

[Recorders.ClogRecorderFile]
id = 2
enabled = true
metainfo = "{_cwd}{_path_separator}logs{_path_separator}metainfo"
directory = "{_cwd}{_path_separator}logs{_path_separator}{_year}{_month}{_day}{_path_separator}"
file = "log_{_log_index}_{_year}{_month}{_day}_{_hour}{_minute}{_second}.log"
# file spilt, [type, value]
#   type: 0 - no spilt, value is ignored
#         1 - spilt by size, value(unit: Byte) is the max size of a log file
#         2 - spilt by time, value(unit: Second) is the time interval between two log files
#         3 - spilt by num of log items, value(unit: Number) is the max num of log items
split = [1, 1048576] # 1MB